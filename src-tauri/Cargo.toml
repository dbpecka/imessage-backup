[package]
name = "imessage-backup"
version = "0.1.0"
edition = "2021"
description = "macOS app for iMessage backup, attachment extraction, and selective deletion"
authors = ["Derek Pecka <derek@pecka.io>"]
publish = false

[lib]
name = "imessage_backup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "imessage-backup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = "0.7"
chrono = "0.4"

# Library crate from the fork (dbpecka/imessage-exporter), pinned to an exact
# commit so a signed build can't silently pick up whatever is on `develop`.
# To bump it, update `rev` after reviewing the fork's changes.
#
# To develop against a local checkout of the fork instead, create
# `src-tauri/.cargo/config.toml` (git-ignored) with:
#
#   [patch."https://github.com/dbpecka/imessage-exporter"]
#   imessage-database = { path = "../../imessage-exporter/imessage-database" }
imessage-database = { git = "https://github.com/dbpecka/imessage-exporter", rev = "cffac6a59099f8c1398c4089bd20fe222d983fa0", features = ["export", "write"] }
rusqlite = { version = "0.39", features = ["backup"] }

[dev-dependencies]
tempfile = "3.12"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
